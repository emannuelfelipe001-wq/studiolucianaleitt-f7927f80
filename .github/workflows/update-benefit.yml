name: Update benefit text

on:
  push:
    paths:
      - '.github/workflows/update-benefit.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/config/clinic.ts')
          s = p.read_text()
          old = 'Produtos selecionados, higiene rigorosa e resultado natural.'
          new = 'Produtos selecionados, protocolos cuidadosos e atenção em cada etapa para proporcionar uma experiência segura, confortável e resultados naturais.'
          if old not in s:
              raise SystemExit('Texto antigo não encontrado; nenhuma alteração feita.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config/clinic.ts .github/workflows/update-benefit.yml
          git rm .github/workflows/update-benefit.yml
          git commit -m 'content: improve care benefit text'
          git push